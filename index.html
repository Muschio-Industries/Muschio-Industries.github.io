<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Muschio Industries: una raccolta ludica di idee, cazzate e pronostici.">
  <meta name="theme-color" content="#07553d">
  <title>Muschio Industries</title>
  <style>
    :root{--green:#07553d;--yellow:#ffdb16;--paper:#f2f3ef}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--green);font:16px/1.5 Arial,Helvetica,sans-serif}
    .page{min-height:100vh;display:grid;place-items:center;padding:24px}
    .content{width:min(680px,100%);text-align:center}
    .brand{margin:0;font-size:clamp(42px,10vw,76px);line-height:1;font-style:italic;letter-spacing:-4px}
    .brand span{color:#d2b400}
    .intro{margin:28px auto 34px;max-width:540px;font-size:clamp(18px,3vw,24px);color:#384c43}
    .button{display:inline-block;padding:14px 22px;background:var(--yellow);color:var(--green);font-weight:800;text-decoration:none}
    .button:hover{background:#ffe652}
    a:focus-visible{outline:3px solid #d2b400;outline-offset:5px}
    footer{margin-top:42px;font-size:12px;color:#66746d}
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <p class="brand">Muschio<span>Industries</span></p>
      <p class="intro">Questa repo ha un solo scopo: raccogliere cazzate fatte nei momenti di noia. Niente di serio, ma sempre al vostro servizio.</p>
      <a class="button" href="./registro-puntate/">Vai al registro puntate&nbsp;↗</a>
      <footer>Una cosa fatta per gioco. E si vede.</footer>
    </div>
  </main>
</body>
</html>
